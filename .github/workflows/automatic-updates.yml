name: Update series periodically or upon manual trigger

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  update:
    name: Update series
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends jq

    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

          #- name: Checkout twint
          #  uses: actions/checkout@v3
          #  with:
          #    repository: catgirl-v/twint
          #    path: twint

          #- name: Install twint
          #  run: pip3 install -e .
          #  working-directory: twint

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Set up Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        audience: ${{ secrets.TS_AUDIENCE }}
        ping: ${{ secrets.TS_EXIT_NODE }}
        args: "--exit-node=${{ secrets.TS_EXIT_NODE }}"
        tags: tag:catgirl-v

    - name: Run update script
      env:
        TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        REDDIT_LOID: ${{ secrets.REDDIT_LOID }}
        TINYVIEW_GOOGLEAPIS_KEY: ${{ secrets.TINYVIEW_GOOGLEAPIS_KEY }}
        TINYVIEW_REFRESH_TOKEN: ${{ secrets.TINYVIEW_REFRESH_TOKEN }}
      run: ./update_series.sh

    - name: Disable exit node
      run: sudo tailscale set --exit-node ''

    - name: Commit changes
      run: |
        git config --global user.name 'catgirl-bot'
        git config --global user.email '<>'
        git add series
        git commit -m "Update index (beep boop)" || exit 0
        git push
